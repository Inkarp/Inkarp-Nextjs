<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A single circulating tumour cell highlighted in red among many pale blood cells">
  <title>Rare cell detection</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>

    <radialGradient id="focus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ctc" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#e8323f"/>
      <stop offset="1" stop-color="#a2000d"/>
    </radialGradient>

    <!-- One pale blood cell, reused. Ring + lighter centre reads as a biconcave
         erythrocyte at any size, and keeps the file small. -->
    <g id="cell">
      <circle r="15" fill="#dfe3e8"/>
      <circle r="7.5" fill="#eceef1"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Field of ordinary blood cells. Positions are hand-placed rather than
       random so the composition survives the card's object-cover crop: the
       centre stays clear for the highlighted cell. -->
  <g opacity="0.85">
    <use href="#cell" x="70"   y="80"  transform="scale(1.05)"/>
    <use href="#cell" x="185"  y="52"/>
    <use href="#cell" x="300"  y="104" transform="scale(0.9)"/>
    <use href="#cell" x="415"  y="60"/>
    <use href="#cell" x="530"  y="118" transform="scale(1.1)"/>
    <use href="#cell" x="655"  y="70"  transform="scale(0.85)"/>
    <use href="#cell" x="775"  y="112"/>
    <use href="#cell" x="890"  y="58"  transform="scale(1.05)"/>
    <use href="#cell" x="1005" y="106" transform="scale(0.9)"/>
    <use href="#cell" x="1120" y="66"/>

    <use href="#cell" x="120"  y="192" transform="scale(0.95)"/>
    <use href="#cell" x="245"  y="240"/>
    <use href="#cell" x="360"  y="188" transform="scale(1.1)"/>
    <use href="#cell" x="478"  y="246" transform="scale(0.85)"/>
    <use href="#cell" x="700"  y="236"/>
    <use href="#cell" x="820"  y="190" transform="scale(1.05)"/>
    <use href="#cell" x="940"  y="248" transform="scale(0.9)"/>
    <use href="#cell" x="1062" y="196"/>
    <use href="#cell" x="1150" y="252" transform="scale(0.95)"/>

    <use href="#cell" x="58"   y="330" transform="scale(1.1)"/>
    <use href="#cell" x="178"  y="384" transform="scale(0.9)"/>
    <use href="#cell" x="298"  y="326"/>
    <use href="#cell" x="418"  y="392" transform="scale(1.05)"/>
    <use href="#cell" x="782"  y="330" transform="scale(0.85)"/>
    <use href="#cell" x="902"  y="388"/>
    <use href="#cell" x="1022" y="332" transform="scale(1.1)"/>
    <use href="#cell" x="1138" y="394" transform="scale(0.9)"/>

    <use href="#cell" x="96"   y="470"/>
    <use href="#cell" x="216"  y="524" transform="scale(1.05)"/>
    <use href="#cell" x="336"  y="466" transform="scale(0.9)"/>
    <use href="#cell" x="456"  y="530"/>
    <use href="#cell" x="576"  y="472" transform="scale(1.1)"/>
    <use href="#cell" x="696"  y="528" transform="scale(0.85)"/>
    <use href="#cell" x="816"  y="468"/>
    <use href="#cell" x="936"  y="526" transform="scale(1.05)"/>
    <use href="#cell" x="1056" y="474" transform="scale(0.9)"/>
    <use href="#cell" x="1160" y="532"/>

    <use href="#cell" x="150"  y="594" transform="scale(0.95)"/>
    <use href="#cell" x="390"  y="600" transform="scale(0.85)"/>
    <use href="#cell" x="630"  y="596"/>
    <use href="#cell" x="870"  y="602" transform="scale(0.9)"/>
    <use href="#cell" x="1110" y="598" transform="scale(0.95)"/>
  </g>

  <!-- Clearing behind the target so it separates from the field under any crop. -->
  <circle cx="600" cy="315" r="210" fill="url(#focus)"/>

  <!-- The one rare cell: the whole point of the article. -->
  <g>
    <circle cx="600" cy="315" r="120" fill="none" stroke="#be0010" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle cx="600" cy="315" r="88" fill="none" stroke="#be0010" stroke-opacity="0.34" stroke-width="1.5"
            stroke-dasharray="10 8"/>

    <circle cx="600" cy="315" r="46" fill="url(#ctc)"/>
    <circle cx="583" cy="299" r="15" fill="#ffffff" fill-opacity="0.32"/>

    <!-- Detection brackets -->
    <g stroke="#be0010" stroke-width="3" stroke-linecap="square" fill="none">
      <path d="M528 271 v-18 h18"/>
      <path d="M672 271 v-18 h-18"/>
      <path d="M528 359 v18 h18"/>
      <path d="M672 359 v18 h-18"/>
    </g>
  </g>

  <!-- Brand accent rule, bottom-left. Survives the crop on wide cards. -->
  <rect x="0" y="626" width="1200" height="4" fill="#be0010"/>
</svg>
