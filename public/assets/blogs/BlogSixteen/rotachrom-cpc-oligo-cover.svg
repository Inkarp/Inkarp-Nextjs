<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A centrifugal partition chromatography rotor separating an oligonucleotide into resolved bands">
  <title>Centrifugal partition chromatography separating an oligonucleotide</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>

    <radialGradient id="clear" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be0010" stop-opacity="0"/>
      <stop offset="1" stop-color="#be0010" stop-opacity="0.9"/>
    </linearGradient>

    <!-- One partition cell of the rotor. -->
    <g id="chamber">
      <rect x="-13" y="-30" width="26" height="60" rx="7" fill="#e4e7eb" stroke="#c8cdd4" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Faint baseline grid, reading as a chromatogram field. -->
  <g stroke="#d7dbe0" stroke-width="1" opacity="0.55">
    <path d="M0 150 H1200"/><path d="M0 250 H1200"/>
    <path d="M0 370 H1200"/><path d="M0 470 H1200"/>
  </g>

  <circle cx="600" cy="312" r="250" fill="url(#clear)"/>

  <!-- Rotor: partition chambers arranged radially, the core of CPC. -->
  <g>
    <circle cx="600" cy="312" r="176" fill="none" stroke="#c8cdd4" stroke-width="2"/>
    <circle cx="600" cy="312" r="96" fill="none" stroke="#d7dbe0" stroke-width="2"/>

    <g transform="translate(600 312)">
      <g transform="rotate(0)   translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(30)  translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(60)  translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(90)  translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(120) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(150) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(180) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(210) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(240) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(270) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(300) translate(0 -136)"><use href="#chamber"/></g>
      <g transform="rotate(330) translate(0 -136)"><use href="#chamber"/></g>
    </g>

    <!-- Rotation cue. -->
    <path d="M 600 92 A 220 220 0 0 1 820 312" fill="none" stroke="url(#spin)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 806 292 L 822 314 L 798 322 Z" fill="#be0010"/>
  </g>

  <!-- The 20-mer entering as one mixed strand, leaving as resolved product. -->
  <g transform="translate(600 312)">
    <circle r="62" fill="#ffffff"/>
    <circle r="62" fill="none" stroke="#e0e3e8" stroke-width="2"/>
    <g fill="#be0010">
      <circle cx="-34" cy="0" r="8"/>
      <circle cx="-17" cy="-9" r="8"/>
      <circle cx="0"   cy="0" r="8"/>
      <circle cx="17"  cy="9" r="8"/>
      <circle cx="34"  cy="0" r="8"/>
    </g>
    <path d="M-34 0 L-17 -9 L0 0 L17 9 L34 0" fill="none" stroke="#be0010" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Resolved bands: the separation result, weighted toward the target. -->
  <g>
    <rect x="150" y="546" width="180" height="14" rx="7" fill="#c8cdd4"/>
    <rect x="380" y="546" width="180" height="14" rx="7" fill="#9aa3ad"/>
    <rect x="610" y="546" width="180" height="14" rx="7" fill="#be0010"/>
    <rect x="840" y="546" width="180" height="14" rx="7" fill="#c8cdd4"/>
  </g>

  <rect x="0" y="626" width="1200" height="4" fill="#be0010"/>
</svg>
