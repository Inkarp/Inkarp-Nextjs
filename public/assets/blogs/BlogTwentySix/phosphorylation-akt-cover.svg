<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A phosphate group transferring onto a protein, activating it by phosphorylation">
  <title>Phosphorylation activating a protein</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>

    <radialGradient id="clear" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inactive" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#e2e5ea"/>
      <stop offset="1" stop-color="#b9bfc8"/>
    </radialGradient>

    <radialGradient id="active" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#e8323f"/>
      <stop offset="1" stop-color="#a2000d"/>
    </radialGradient>

    <!-- A protein: two lobes with a substrate cleft between them. -->
    <g id="protein">
      <path d="M -78 -18 A 62 62 0 0 1 -2 -66 A 58 58 0 0 1 74 -22 A 64 64 0 0 1 52 58
               A 60 60 0 0 1 -34 62 A 60 60 0 0 1 -78 -18 Z"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Faint membrane band: Akt/PKB is recruited to the inner leaflet. -->
  <g opacity="0.5">
    <path d="M0 96 H1200" stroke="#d7dbe0" stroke-width="2"/>
    <path d="M0 120 H1200" stroke="#d7dbe0" stroke-width="2"/>
    <g fill="#dfe3e8">
      <circle cx="60"  cy="108" r="9"/><circle cx="140" cy="108" r="9"/>
      <circle cx="220" cy="108" r="9"/><circle cx="300" cy="108" r="9"/>
      <circle cx="380" cy="108" r="9"/><circle cx="460" cy="108" r="9"/>
      <circle cx="540" cy="108" r="9"/><circle cx="620" cy="108" r="9"/>
      <circle cx="700" cy="108" r="9"/><circle cx="780" cy="108" r="9"/>
      <circle cx="860" cy="108" r="9"/><circle cx="940" cy="108" r="9"/>
      <circle cx="1020" cy="108" r="9"/><circle cx="1100" cy="108" r="9"/>
      <circle cx="1180" cy="108" r="9"/>
    </g>
  </g>

  <circle cx="600" cy="350" r="250" fill="url(#clear)"/>

  <!-- Unphosphorylated protein, inactive. -->
  <g transform="translate(320 356)" fill="url(#inactive)" stroke="#a8afb9" stroke-width="2">
    <use href="#protein"/>
  </g>

  <!-- Transfer arrow. -->
  <g>
    <path d="M 452 350 C 512 306, 566 306, 620 336" fill="none" stroke="#be0010"
          stroke-width="6" stroke-linecap="round"/>
    <path d="M 606 318 L 634 340 L 604 356 Z" fill="#be0010"/>
  </g>

  <!-- Phosphorylated protein, active. -->
  <g transform="translate(838 356)">
    <g fill="url(#active)" stroke="#8c000b" stroke-width="2">
      <use href="#protein"/>
    </g>
    <!-- The transferred phosphate, docked at the regulatory site. -->
    <g transform="translate(56 -62)">
      <circle r="34" fill="#ffffff" stroke="#be0010" stroke-width="5"/>
      <text x="0" y="12" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
            font-size="36" font-weight="700" fill="#be0010">P</text>
    </g>
    <circle cx="-30" cy="-28" r="16" fill="#ffffff" fill-opacity="0.24"/>
  </g>

  <!-- The phosphate donor travelling along the arrow. -->
  <g transform="translate(536 306)">
    <circle r="18" fill="#be0010" fill-opacity="0.14" stroke="#be0010" stroke-width="2"/>
    <circle r="6" fill="#be0010"/>
  </g>

  <rect x="0" y="626" width="1200" height="4" fill="#be0010"/>
</svg>
