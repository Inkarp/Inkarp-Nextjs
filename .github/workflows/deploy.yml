name: Deploy to Server
on:
  push:
  branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 72.60.98.245
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH="/home/inkarpnext/.nvm/versions/node/$(ls /home/inkarpnext/.nvm/versions/node)/bin:$PATH"
            export PM2_HOME="/home/deploy/.pm2"
            git config --global --add safe.directory /home/inkarpnext/htdocs/nextapp.72.60.98.245.nip.io
            cd /home/inkarpnext/htdocs/nextapp.72.60.98.245.nip.io
            git pull origin main
            npm install
            npm run build
            pm2 restart inkarp-next || pm2 start npm --name "inkarp-next" -- run start
            pm2 save
