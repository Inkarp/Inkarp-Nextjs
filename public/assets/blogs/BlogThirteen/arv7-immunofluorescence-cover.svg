<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A circulating tumour cell stained across three immunofluorescence channels, with nuclear ARv7 signal in red">
  <title>Multi-channel immunofluorescence of a circulating tumour cell</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>

    <radialGradient id="clear" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyto" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8fd3bd"/>
      <stop offset="1" stop-color="#3f8f78"/>
    </radialGradient>

    <radialGradient id="nuc" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#8fa8d8"/>
      <stop offset="1" stop-color="#3c5391"/>
    </radialGradient>

    <!-- Excluded leukocyte: CD45-positive, deliberately colourless. -->
    <g id="wbc">
      <circle r="17" fill="#dfe3e8"/>
      <circle r="8" fill="#eceef1"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.8">
    <use href="#wbc" x="88"   y="92"/>
    <use href="#wbc" x="232"  y="58"  transform="scale(0.9)"/>
    <use href="#wbc" x="352"  y="128" transform="scale(1.05)"/>
    <use href="#wbc" x="880"  y="74"  transform="scale(0.95)"/>
    <use href="#wbc" x="1012" y="132"/>
    <use href="#wbc" x="1132" y="70"  transform="scale(0.9)"/>
    <use href="#wbc" x="132"  y="268" transform="scale(1.05)"/>
    <use href="#wbc" x="268"  y="222" transform="scale(0.85)"/>
    <use href="#wbc" x="944"  y="228"/>
    <use href="#wbc" x="1082" y="286" transform="scale(1.05)"/>
    <use href="#wbc" x="96"   y="424" transform="scale(0.9)"/>
    <use href="#wbc" x="238"  y="486"/>
    <use href="#wbc" x="358"  y="418" transform="scale(1.05)"/>
    <use href="#wbc" x="862"  y="480" transform="scale(0.85)"/>
    <use href="#wbc" x="1000" y="420"/>
    <use href="#wbc" x="1128" y="492" transform="scale(0.95)"/>
    <use href="#wbc" x="176"  y="588" transform="scale(0.9)"/>
    <use href="#wbc" x="470"  y="596" transform="scale(0.85)"/>
    <use href="#wbc" x="742"  y="592"/>
    <use href="#wbc" x="1040" y="600" transform="scale(0.9)"/>
  </g>

  <circle cx="600" cy="310" r="230" fill="url(#clear)"/>

  <!-- Channel arcs: the three stains the panel reads, drawn as an outer ring. -->
  <g fill="none" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M 600 140 A 170 170 0 0 1 747 395" stroke="#3c5391"/>
    <path d="M 747 395 A 170 170 0 0 1 453 395" stroke="#3f8f78"/>
    <path d="M 453 395 A 170 170 0 0 1 600 140" stroke="#be0010"/>
  </g>

  <!-- The cell itself: cytokeratin/EpCAM cytoplasm, stained nucleus, ARv7 foci. -->
  <g>
    <circle cx="600" cy="310" r="104" fill="url(#cyto)"/>
    <circle cx="600" cy="310" r="104" fill="none" stroke="#2f7663" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="600" cy="310" r="58" fill="url(#nuc)"/>

    <!-- Nuclear ARv7 localisation — the assay's actual positive readout. -->
    <g fill="#be0010">
      <circle cx="586" cy="296" r="9"/>
      <circle cx="616" cy="308" r="7"/>
      <circle cx="597" cy="329" r="8"/>
      <circle cx="621" cy="284" r="5"/>
      <circle cx="573" cy="320" r="5"/>
    </g>
    <circle cx="576" cy="288" r="17" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <rect x="0" y="626" width="1200" height="4" fill="#be0010"/>
</svg>
